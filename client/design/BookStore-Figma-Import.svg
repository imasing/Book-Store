    <text x="235" y="295" text-anchor="middle" fill="#6250c7" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600">Đọc thử</text>
    <rect x="18" y="397" width="354" height="412" fill="#e4ebf0" opacity="0.5"/>
