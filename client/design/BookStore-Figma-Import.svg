      <circle cx="304" cy="145" r="120" fill="#edc99a" opacity="0.68"/>
      <path d="M0 370 L110 230 L188 329 L278 197 L390 360 L390 545 L0 545Z" fill="#263a48" opacity="0.82"/>
      <path d="M0 438 L95 318 L174 395 L257 286 L390 423 L390 545 L0 545Z" fill="#172e3b" opacity="0.7"/>
