    <text x="1323" y="332" text-anchor="middle" fill="#667078" font-family="Figtree, Arial, sans-serif" font-size="10">LỰA CHỌN</text>
    <text x="1323" y="346" text-anchor="middle" fill="#667078" font-family="Figtree, Arial, sans-serif" font-size="10">CỦA TUẦN</text>

    <rect x="0" y="716" width="1440" height="242" fill="#fff" opacity="0.55"/>
    <rect x="70" y="754" width="205" height="164" fill="#dce6ec"/>
