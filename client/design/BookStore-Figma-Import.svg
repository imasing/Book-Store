    <g transform="translate(254 1090) scale(.48)"><use xlink:href="#cover-rust"/></g>
    <g transform="translate(436 1090) scale(.48)"><use xlink:href="#cover-blue"/></g>
    <text x="154" y="1137" fill="#25242b" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600">Những ngày xanh</text>
    <text x="336" y="1137" fill="#25242b" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600">Người giữ lửa</text>
    <text x="518" y="1137" fill="#25242b" font-family="Figtree, Arial, sans-serif" font-size="13" font-weight="600">Bản đồ im lặng</text>
