      <text x="195" y="224" text-anchor="middle" fill="#f8eee0" font-family="Manrope, Arial, sans-serif" font-size="12" letter-spacing="2">MỘT CUỐN TIỂU THUYẾT</text>
      <text x="195" y="503" text-anchor="middle" fill="#fff" font-family="'DM Serif Display', Georgia, serif" font-size="22">LÊ MINH AN</text>
