    <text x="327" y="776" fill="#6250c7" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">GÓC NGƯỜI ĐỌC</text>
    <text x="327" y="821" fill="#25242b" font-family="'DM Serif Display', Georgia, serif" font-size="39">Một tiệm sách, nhiều thế giới</text>
    <text x="327" y="857" fill="#667078" font-family="Figtree, Arial, sans-serif" font-size="15">Mộc Bản chọn những cuốn sách có thể đồng hành cùng bạn — từ một buổi chiều yên</text>
    <text x="327" y="882" fill="#667078" font-family="Figtree, Arial, sans-serif" font-size="15">tĩnh đến những chuyến đi dài. Tìm cuốn sách tiếp theo của mình ngay hôm nay.</text>
    <text x="327" y="920" fill="#6250c7" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600">Khám phá câu chuyện của chúng tôi  →</text>

    <text x="72" y="1024" fill="#6250c7" font-family="Figtree, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3">MỚI TRÊN KỆ</text>
    <text x="72" y="1068" fill="#25242b" font-family="'DM Serif Display', Georgia, serif" font-size="34">Sách mới phát hành</text>
    <text x="1210" y="1060" fill="#6250c7" font-family="Figtree, Arial, sans-serif" font-size="14" font-weight="600">Xem tất cả sách  →</text>
