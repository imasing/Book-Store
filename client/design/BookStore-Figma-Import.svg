<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1910" height="1150" viewBox="0 0 1910 1150">
  <defs>
    <linearGradient id="cover-main" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263c52"/>
      <stop offset="0.52" stop-color="#597a80"/>
      <stop offset="1" stop-color="#c27d5c"/>
    </linearGradient>
    <linearGradient id="cover-side" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#f1d39c"/>
      <stop offset="1" stop-color="#b95d49"/>
    </linearGradient>
    <linearGradient id="cover-small" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9e7df"/>
      <stop offset="1" stop-color="#668879"/>
    </linearGradient>
    <filter id="cover-shadow" x="-20%" y="-15%" width="150%" height="145%">
      <feDropShadow dx="0" dy="18" stdDeviation="17" flood-color="#1d2630" flood-opacity="0.2"/>
    </filter>
    <clipPath id="desktop-cover-clip"><rect x="874" y="132" width="390" height="545" rx="2"/></clipPath>
    <clipPath id="mobile-cover-clip"><rect x="1552" y="417" width="266" height="372" rx="2"/></clipPath>
    <g id="cover-art">
